name: Vigilante BTC Cloud

on:
  schedule:
    - cron: '*/5 * * * *'       # respaldo: GitHub solo permite minimo 5 min (el motor real es cron-job.org)
  workflow_dispatch:            # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: write   # para guardar estado.json e historial.jsonl en la rama 'estado'

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Cargar estado previo (rama estado)
        run: |
          git fetch origin estado 2>/dev/null || true
          git checkout origin/estado -- estado.json historial.jsonl 2>/dev/null || echo "sin estado previo, empezando de cero"
          git checkout origin/estado -- micro.jsonl 2>/dev/null || true

      - name: Red neuronal (opcional, no rompe nada si falla)
        run: |
          pip install --quiet onnxruntime \
            || pip install --quiet --break-system-packages onnxruntime \
            || python -m pip install --quiet --break-system-packages onnxruntime \
            || echo "onnxruntime no instalado: el bot sigue sin red"
          if [ -f modelo/vigilante_lstm.onnx ] && [ -f modelo/meta.json ] && [ -f modelo/scaler.json ]; then
            echo "VIGILANTE_NN=1" >> "$GITHUB_ENV"
            echo "Red neuronal ACTIVADA (modelo encontrado en modelo/)."
          else
            echo "Sin modelo en modelo/: el bot corre con su logica de siempre."
          fi

      - name: Recolectar microestructura (forward, no rompe nada)
        run: |
          if [ -f recolector_micro.py ]; then
            python recolector_micro.py --append micro.jsonl || echo "recoleccion fallo, se continua"
          else
            echo "sin recolector_micro.py en el repo: se omite el paso (el bot no se ve afectado)"
          fi

      - name: Ejecutar vigilante (analisis + Telegram)
        run: python vigilante_cloud.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_BANCO: "1000"
          PAPER_LEV: "10"

      - name: Generar dashboard
        run: |
          python dashboard.py || echo "dashboard.py fallo, se publica aviso"
          ls -la docs/ || echo "sin docs"
          cp docs/index.html /tmp/dash_index.html 2>/dev/null || echo "sin dashboard para publicar"
          cp docs/motor.html /tmp/dash_motor.html 2>/dev/null || echo "sin motor para publicar"
          cp assets/melodia.mp4 /tmp/dash_melodia.mp4 2>/dev/null || echo "sin melodia"

      - name: Guardar estado e historial (rama estado, se reescribe limpio)
        run: |
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          cp estado.json /tmp/estado.json
          cp historial.jsonl /tmp/historial.jsonl 2>/dev/null || echo "sin historial previo (primer run)"
          cp micro.jsonl /tmp/micro.jsonl 2>/dev/null || echo "sin micro previo (primer run)"
          git checkout --orphan estado_tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/estado.json ./estado.json
          cp /tmp/historial.jsonl ./historial.jsonl 2>/dev/null || true
          cp /tmp/micro.jsonl ./micro.jsonl 2>/dev/null || true
          git add estado.json historial.jsonl
          git add micro.jsonl 2>/dev/null || true
          git commit -m "estado $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0; for i in 1 2 3; do git push --force origin estado_tmp:estado && { ok=1; break; } || sleep 10; done; [ $ok -eq 1 ]
          git checkout -f ${GITHUB_REF_NAME}
          git branch -D estado_tmp

      - name: Publicar dashboard (rama dashboard, se reescribe limpio)
        run: |
          if [ ! -f /tmp/dash_index.html ]; then echo "sin dashboard"; exit 0; fi
          git fetch origin dashboard 2>/dev/null || true
          changed=0
          git show origin/dashboard:index.html 2>/dev/null | cmp -s /tmp/dash_index.html - || changed=1
          if [ -f /tmp/dash_motor.html ]; then
            git show origin/dashboard:motor.html 2>/dev/null | cmp -s /tmp/dash_motor.html - || changed=1
          fi
          if [ "$changed" -eq 0 ]; then echo "dashboard sin cambios"; exit 0; fi
          git checkout --orphan dash_tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/dash_index.html ./index.html
          cp /tmp/dash_motor.html ./motor.html 2>/dev/null || true
          cp /tmp/dash_melodia.mp4 ./melodia.mp4 2>/dev/null || true
          git add index.html motor.html
          git add melodia.mp4 2>/dev/null || true
          git commit -m "dashboard $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          ok=0; for i in 1 2 3; do git push --force origin dash_tmp:dashboard && { ok=1; break; } || sleep 10; done; [ $ok -eq 1 ]
          git checkout -f ${GITHUB_REF_NAME}
          git branch -D dash_tmp
