name: Vigilante BTC Cloud

on:
  schedule:
    - cron: '*/5 * * * *'       # respaldo: GitHub solo permite minimo 5 min (el motor real es cron-job.org)
  workflow_dispatch:            # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: write   # para guardar estado.json e historial.jsonl en la rama 'estado'

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Cargar estado previo (rama estado)
        run: |
          git fetch origin estado 2>/dev/null || true
          git checkout origin/estado -- estado.json historial.jsonl 2>/dev/null || echo "sin estado previo, empezando de cero"

      - name: Ejecutar vigilante (analisis + Telegram)
        run: python vigilante_cloud.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Generar dashboard
        run: |
          python dashboard.py || echo "dashboard.py fallo, se publica aviso"
          ls -la docs/ || echo "sin docs"
          cp docs/index.html /tmp/dash_index.html 2>/dev/null || echo "sin dashboard para publicar"
          cp assets/melodia.mp4 /tmp/dash_melodia.mp4 2>/dev/null || echo "sin melodia"

      - name: Guardar estado e historial (rama estado, se reescribe limpio)
        run: |
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          cp estado.json historial.jsonl /tmp/
          git checkout --orphan estado_tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/estado.json /tmp/historial.jsonl .
          git add estado.json historial.jsonl
          git commit -m "estado $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0; for i in 1 2 3; do git push --force origin estado_tmp:estado && { ok=1; break; } || sleep 10; done; [ $ok -eq 1 ]
          git checkout -f ${GITHUB_REF_NAME}
          git branch -D estado_tmp

      - name: Publicar dashboard (rama dashboard, se reescribe limpio)
        run: |
          if [ ! -f /tmp/dash_index.html ]; then echo "sin dashboard"; exit 0; fi
          git checkout --orphan dash_tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/dash_index.html ./index.html
          cp /tmp/dash_melodia.mp4 ./melodia.mp4 2>/dev/null || true
          git add index.html melodia.mp4 2>/dev/null || git add index.html
          git commit -m "dashboard $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          ok=0; for i in 1 2 3; do git push --force origin dash_tmp:dashboard && { ok=1; break; } || sleep 10; done; [ $ok -eq 1 ]
          git checkout -f ${GITHUB_REF_NAME}
          git branch -D dash_tmp
