name: Resumen semanal

# REARME 2026-11-01: antes resumia la operacion (pasadas, alertas, papel,
# banco) y la mandaba a Telegram. Ahora publica el DIGEST SEMANAL de
# posicionamiento medido: como se movio cada serie del archivo.
#
# No opera. Solo mide y publica.

on:
  schedule:
    - cron: '10 13 * * MON'      # lunes, despues del informe diario
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumen
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bajar el corte (por si el archivo fallo)
        run: python3 analysis/archivo_micro.py --diario

      - name: Generar el digest semanal
        run: |
          python3 analysis/resumen_semanal.py
          echo "--- resumen_semanal.md ---"
          cat analysis/data/resumen_semanal.md

      - name: Publicar
        run: |
          git config user.name  "vigilante-resumen[bot]"
          git config user.email "vigilante-resumen@users.noreply.github.com"
          git add analysis/data/resumen_semanal.json analysis/data/resumen_semanal.md \
                  analysis/data/percentiles_hist.jsonl
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "resumen: digest semanal $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            echo "reintento $i..."
            git pull --rebase origin main --quiet
            sleep 10
          done
