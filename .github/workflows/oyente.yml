name: Oyente

on:
  schedule:
    - cron: '*/5 * * * *'   # respaldo si cron-job.org falla (misma frecuencia que vigilante)
  workflow_dispatch:

permissions:
  contents: write   # solo para publicar la rama 'dashboard'

# CAMBIO: grupo propio. Antes compartia 'vigilante' con el analista y GitHub
# cancelaba ~la mitad de las pasadas (cadencia real ~8.7 min). Ahora no chocan.
# El oyente ya NO maneja comandos ni escribe estado.json (eso lo hace el
# analista en cada pasada y ya respondia los comandos), asi que no hay carrera
# de escritura sobre la rama 'estado'.
concurrency:
  group: oyente
  cancel-in-progress: false

jobs:
  oir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Cargar estado previo (rama estado, SOLO LECTURA)
        run: |
          git fetch origin estado 2>/dev/null || true
          git checkout origin/estado -- estado.json historial.jsonl 2>/dev/null || echo "sin estado previo"

      - name: Refrescar dashboard (solo lectura del estado)
        run: |
          python dashboard.py || echo "dashboard fallo"
          cp docs/index.html /tmp/dash_index.html 2>/dev/null || echo "sin dashboard"
          cp assets/melodia.mp4 /tmp/dash_melodia.mp4 2>/dev/null || true

      - name: Publicar dashboard (rama dashboard)
        run: |
          if [ ! -f /tmp/dash_index.html ]; then echo "sin dashboard"; exit 0; fi
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          git fetch origin dashboard 2>/dev/null || true
          if git show origin/dashboard:index.html 2>/dev/null | cmp -s /tmp/dash_index.html -; then echo "dashboard sin cambios"; exit 0; fi
          git checkout --orphan dash_tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/dash_index.html ./index.html
          cp /tmp/dash_melodia.mp4 ./melodia.mp4 2>/dev/null || true
          git add index.html melodia.mp4 2>/dev/null || git add index.html
          git commit -m "dashboard $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          ok=0; for i in 1 2 3; do git push --force origin dash_tmp:dashboard && { ok=1; break; } || sleep 10; done; [ $ok -eq 1 ]
          git checkout -f ${GITHUB_REF_NAME}
          git branch -D dash_tmp
