name: WF re-entrenar (semanal)

on:
  schedule:
    - cron: '41 2 * * 1'      # lunes 02:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Revisa si el modelo publicado sigue ganando fuera de muestra. NO lo
      # reemplaza solo: deja la evidencia (wf_folds.json + scoreboard) para que
      # la decision de publicar sea explicita y quede registrada.
      - name: Walk-forward de control (11 folds, embargo 24h)
        run: |
          python analysis/entrenar_hold.py \
            --datadir analysis/data/cache \
            --desde 2023-01-01 --hasta 2026-09-30 \
            --test-dias 90 --train-dias 365 --embargo-horas 24 \
            --etiqueta wf-control-semanal \
            --out-folds data/wf_folds.json \
            --out-muestras data/wf_muestras.jsonl

      - name: Preparar cache si no existe (descarga publica)
        run: |
          # BUG ARREGLADO (2026-10-27): el control entrena 2023-01->2026-09 pero el
          # cache se bajaba solo desde trained_until (backfill lo fija por diseno):
          # en runner limpio no habia overlap y el WF fallaba. Ahora baja el
          # historico completo (reanudable, ~10 min) antes de entrenar.
          if [ ! -f analysis/data/cache/klines_5m.jsonl ]; then
            python - <<'PY'
          import datetime
          import sys
          sys.path.insert(0, "analysis")
          from backfill import asegurar_datos
          asegurar_datos("analysis/data/cache",
                         datetime.datetime(2022, 1, 1, tzinfo=datetime.UTC))
          PY
          fi

      - name: Guardar scoreboard de experimentos
        run: |
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          python - <<'PY'
          import json, os, datetime
          os.makedirs("analysis/experimentos", exist_ok=True)
          p = "analysis/experimentos/scoreboard.jsonl"
          fila = {"t": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "id": "wf-control-semanal", "estado": "revision"}
          with open(p, "a", encoding="utf-8") as fh:
              fh.write(json.dumps(fila, ensure_ascii=False) + "\n")
          PY
          git add data/wf_folds.json data/wf_muestras.jsonl analysis/experimentos/scoreboard.jsonl || echo "nada"
          git commit -m "wf: control semanal $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git reset --hard HEAD -q
          git config pull.rebase true
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            if git rebase origin/main && git push --force-with-lease origin HEAD:main; then ok=1; break; fi
            echo "reintento $i/5"; sleep 15
          done
          [ $ok -eq 1 ]

      - name: Publicar folds como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: wf-folds
          path: data/wf_folds.json
          retention-days: 60
          if-no-files-found: warn
