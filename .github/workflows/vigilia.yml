name: Vigilia latido

# REARME 2026-11-01: el latido vigilaba la rama 'estado' (borrada) y, al no
# encontrarla, emitia "OK transitorio": era un adorno. Ahora vigila lo que de
# verdad importa en la maquina de analisis: que los DATOS sigan llegando y el
# informe este al dia (analysis/check_health.py).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilia
  cancel-in-progress: false

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      detalle: ${{ steps.check.outputs.detalle }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar salud de la maquina
        id: check
        run: |
          python3 analysis/check_health.py > /tmp/salud.json || true
          cat /tmp/salud.json
          python3 - <<'PY'
          import json, os
          data = json.load(open("/tmp/salud.json", encoding="utf-8"))
          out = os.environ["GITHUB_OUTPUT"]
          fallos = data.get("fallos") or []
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("ok=%s\n" % ("true" if data.get("ok") else "false"))
              # resumen corto para el issue (sin comas: son de un json)
              resumen = "; ".join(fallos[:4]) if fallos else "todo al dia"
              fh.write("detalle=%s\n" % resumen.replace("\n", " "))
          print("ok=%s" % data.get("ok"))
          PY

      - name: Exigir salud
        if: always()
        run: |
          echo "ok=${{ steps.check.outputs.ok }} detalle=${{ steps.check.outputs.detalle }}"
          test "${{ steps.check.outputs.ok }}" = "true"

  avisar:
    needs: vigilia
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avisar con issue unica
        env:
          GH_TOKEN: ${{ github.token }}
          # BUG REAL (2026-10-27): este job no tiene actions/checkout, asi que `gh`
          # no tenia repo git del que colgarse y fallaba SIEMPRE. GH_REPO lo hace explicito.
          GH_REPO: ${{ github.repository }}
          OK: ${{ needs.vigilia.outputs.ok }}
          DETALLE: ${{ needs.vigilia.outputs.detalle }}
        run: |
          set -euo pipefail
          TITULO='[vigilia] datos de la maquina atrasados'
          echo "ok=${OK:-} detalle=${DETALLE:-} "
          gh_reint() {
            local n=0
            until "$@"; do
              n=$((n+1)); [ "$n" -ge 3 ] && return 1
              echo "reintento $n tras fallo transitorio: $*"; sleep 10
            done
          }
          intentos=0
          until gh issue list --state open --limit 50 --json number,title,updatedAt > /tmp/issues.json 2>/tmp/gh_err.txt; do
            intentos=$((intentos+1))
            if [ "$intentos" -ge 3 ]; then
              echo "gh issue list fallo 3 veces:"; cat /tmp/gh_err.txt; exit 1
            fi
            echo "reintento $intentos tras fallo transitorio de la API"; sleep 10
          done
          python3 - <<'PY' > /tmp/hallazgo.txt
          import json
          titulo = "[vigilia] datos de la maquina atrasados"
          with open("/tmp/issues.json", encoding="utf-8") as fh:
              items = json.load(fh)
          num = ""; updated = ""
          for it in items:
              if it.get("title") == titulo:
                  num = str(it.get("number", "")); updated = str(it.get("updatedAt", "")); break
          print(f"{num}\t{updated}")
          PY
          NUM="$(cut -f1 /tmp/hallazgo.txt)"
          UPDATED_AT="$(cut -f2 /tmp/hallazgo.txt)"
          if [ "${OK:-}" = "true" ]; then
            if [ -n "$NUM" ]; then
              gh_reint gh issue comment "$NUM" --body "Recuperado: los datos y el informe vuelven a estar al dia. Cierro este aviso."
              gh_reint gh issue close "$NUM"
            else
              echo "Datos ok y sin issue abierta: nada que hacer."
            fi
            exit 0
          fi
          if [ -z "$NUM" ]; then
            cat > /tmp/cuerpo.md <<EOF
          La maquina de analisis tiene datos atrasados. Fallos:

          \`\`\`
          ${DETALLE:-desconocido}
          \`\`\`

          Que hacer:
          - Revisar el workflow 'Archivo microestructura' (cron 25 4 * * *) y el
            'Informe de inteligencia' (45 4 * * *): son los que traen los datos.
          - Binance puede estar bloqueando con HTTP 451 a los runners de GitHub:
            en ese caso el archivo cae a OKX/Bybit. Si ambos fallan, es red.
          - Lanzar a mano \`python analysis/archivo_micro.py --diario\` y
            \`python analysis/informe.py\` desde local para recuperar el dia.

          Enlaces:
          - Arquitectura: ARCHITECTURE.md
          - Diagnosticar: \`python analysis/check_health.py\`
          EOF
            echo "- Acciones del repositorio: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> /tmp/cuerpo.md
            gh_reint gh issue create --title "$TITULO" --body-file /tmp/cuerpo.md
          else
            ANTIG_MIN="$(UPDATED_AT="$UPDATED_AT" python3 -c 'import os; from datetime import datetime, timezone; u=os.environ.get("UPDATED_AT","").strip().replace("Z","+00:00"); ts=datetime.fromisoformat(u); now=datetime.now(timezone.utc); print(int((now-ts).total_seconds()//60))')"
            echo "Issue abierta #$NUM actualizada hace ${ANTIG_MIN}min."
            if [ "$ANTIG_MIN" -gt 30 ]; then
              gh_reint gh issue comment "$NUM" --body "Sigue atrasado (${DETALLE:-sin detalle}). Maximo un comentario cada 30min."
            else
              echo "Comentario reciente: no se comenta para evitar spam."
            fi
          fi

  # P1-2.3 (auditoria): vigila tambien los workflows criticos. Si uno falla 2
  # veces seguidas, se abre/actualiza issue automatico.
  criticos:
    needs: vigilia
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Revisar criticos (2 fallos seguidos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOK = os.environ["GH_TOKEN"]
          CRITICOS = ["Archivo microestructura", "Informe de inteligencia",
                      "Tests", "Analysis tests"]

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + path,
                  headers={"Authorization": "Bearer " + TOK,
                           "User-Agent": "vigilia-criticos",
                           "Accept": "application/vnd.github+json"})
              return json.loads(urllib.request.urlopen(req, timeout=30).read().decode())

          rotos = []
          for nombre in CRITICOS:
              try:
                  wfs = [w for w in api("/actions/workflows")["workflows"]
                         if w["name"] == nombre]
                  if not wfs:
                      continue
                  runs = api(f"/actions/workflows/{wfs[0]['id']}/runs?per_page=2")["workflow_runs"]
                  concl = [r.get("conclusion") for r in runs[:2]]
                  if len(concl) == 2 and all(c == "failure" for c in concl):
                      rotos.append((nombre, runs[0]["html_url"]))
              except Exception as e:
                  print(f"aviso: no pude revisar {nombre}: {e}")

          if not rotos:
              print("criticos OK: ninguno con 2 fallos seguidos.")
              raise SystemExit(0)

          TITULO = "[vigilia] workflow critico Fallando 2 veces seguidas"
          cuerpo = "Estos workflows criticos fallaron sus ultimas 2 corridas:\n\n"
          for nombre, url in rotos:
              cuerpo += f"- **{nombre}**: {url}\n"
          cuerpo += ("\nArquitectura: ver ARCHITECTURE.md. Lo habitual es carrera "
                     "de escritura git sobre una rama compartida; si es de red, "
                     "re-ejecutar. Si sigue, espera la siguiente ventana o corrige "
                     "el protocolo de publicacion.")

          issues = api("/issues?state=open&per_page=50")
          num = next((str(i["number"]) for i in issues if i["title"] == TITULO), "")
          if num:
              api(f"/issues/{num}/comments", "POST",
                  {"body": "Sigue fallando (2 corridas mas).\n\n" + cuerpo})
              print(f"issue #{num} actualizada")
          else:
              api("/issues", "POST", {"title": TITULO, "body": cuerpo})
              print("issue creada")
          PY
