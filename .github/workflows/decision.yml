name: BTC decision log (manual)

# El pipeline horario vive en pipeline.yml. Este workflow queda para recalcular
# una decision sin volver a correr el colector.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Run decision engine
        run: |
          python analysis/run_decision.py \
            --klines collector/data/btcusdt/klines_5m.jsonl \
            --out analysis/data/decisions.jsonl

      - name: Evaluate decisions
        run: |
          python analysis/evaluate_decisions.py \
            --decisions analysis/data/decisions.jsonl \
            --klines collector/data/btcusdt/klines_5m.jsonl \
            --out analysis/data/eval.json

      - name: Validate model
        run: |
          python analysis/validation.py \
            --eval analysis/data/eval.json \
            --backtest analysis/data/backtest.json \
            --decisions analysis/data/decisions.jsonl \
            --klines collector/data/btcusdt/klines_5m.jsonl \
            --collector-health collector/data/health.json \
            --out analysis/data/validation.json \
            --history analysis/data/validation_history.jsonl

      - name: Commit decision log
        run: |
          git config user.name "trading-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add analysis/data
          if git diff --cached --quiet; then
            echo "No new decisions"
            exit 0
          fi
          git commit -m "decision: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push
