name: Analysis tests

on:
  push:
    paths:
      - 'analysis/**/*.py'
      - 'collector/*.py'
      - 'collector/requirements.txt'
      - 'collector/README.md'
      - '.github/workflows/analysis-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run analysis tests
        run: |
          cd analysis
          python test_hold_model.py
          python test_decision_engine.py
          python test_pipeline.py
