name: Analysis tests

on:
  push:
    paths:
      - 'analysis/**/*.py'
      - 'collector/*.py'
      - 'collector/requirements.txt'
      - 'collector/README.md'
      - 'dashboard/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall -q analysis collector

      - name: Guardian anti-secretos (regla de oro)
        run: python tools/secret_scan.py

      - name: Run collector tests
        run: python collector/test_collector.py

      - name: Run analysis tests
        run: |
          cd analysis
          python test_hold_model.py
          python test_decision_engine.py
          python test_pipeline.py
          python test_validation.py
          python test_dashboard.py
          python test_workflows.py
          python test_entrenar_hold.py
          python test_expr_candidatos.py
          python test_etiquetas.py
