name: CI diagnostico 2

# Temporal: corre los comandos que fallan en GitHub y commitea la salida a la
# rama ci-diag2, porque mi token no tiene permiso de leer logs de Actions.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ci-diag.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnosticar
        run: |
          {
            echo "python: $(python3 --version 2>&1)"
            echo "cache presente: $([ -d analysis/data/cache ] && echo si || echo no)"
            echo "cache/klines_5m.jsonl: $([ -f analysis/data/cache/klines_5m.jsonl ] && echo si || echo no)"
            echo ""
            echo "=== test_vigilante.py ==="
            python3 test_vigilante.py 2>&1 | tail -6
            echo "exit=$?"
            echo ""
            echo "=== cada analysis/test_*.py (como el CI) ==="
            for f in analysis/test_*.py; do
              out=$(python3 "$f" 2>&1); code=$?
              echo "--- $f -> exit=$code"
              if [ "$code" != "0" ]; then echo "$out" | tail -12; fi
            done
            echo ""
            echo "=== niveles_hist.py (el paso que falla) ==="
            python3 analysis/niveles_hist.py 2>&1 | tail -12
            echo "exit=$?"
          } > ci_diag.txt 2>&1 || true
          git config user.name "ci-diag[bot]"
          git config user.email "ci-diag@users.noreply.github.com"
          git checkout -B ci-diag2
          git add ci_diag.txt
          git commit -m "diag $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nada"
          git push -f origin ci-diag2 || echo "push fallo"
