name: Tests

on:
  push:
    branches: [main]
    # P1-2.1 (auditoria 2026-10-30): antes solo 5 archivos raiz disparaban los
    # tests: un roto en vigilante/** o analysis/** pasaba a main sin verde.
    paths: ['vigilante_cloud.py', 'test_vigilante.py', 'dashboard.py',
            'backtest.py', '.github/workflows/**',
            'vigilante/**', 'analysis/**', 'modelo_toques.json',
            'collector/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Fijar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guardian anti-secretos (regla de oro)
        run: python tools/secret_scan.py

      - name: Suite de calidad (sin red)
        run: python test_vigilante.py

      # P1-2.1: las suites de analysis/ tambien corren con cada push que las toca
      - name: Suites de analysis (sin red)
        run: |
          for f in analysis/test_*.py; do
            echo "--- $f"
            python "$f" || exit 1
          done
