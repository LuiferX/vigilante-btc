name: Tests

on:
  push:
    branches: [main]
    paths: ['vigilante_cloud.py', 'test_vigilante.py', 'dashboard.py', 'comandos.py', 'backtest.py', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Fijar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guardian anti-secretos (regla de oro)
        run: python tools/secret_scan.py

      - name: Suite de calidad (sin red)
        run: python test_vigilante.py