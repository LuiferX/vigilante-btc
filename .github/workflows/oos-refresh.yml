name: OOS refresh (diario)

on:
  schedule:
    - cron: '23 3 * * *'      # diario 03:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar historial publico (Binance Vision, sin claves)
        run: |
          python analysis/backfill.py --descargar \
            --cache analysis/data/cache \
            --start 2026-10-01T00:00:00+00:00 \
            --out analysis/data/decisions_hist.jsonl \
            --eval-out analysis/data/oos_eval.json

      - name: Backtest OOS (modelo publicado)
        run: |
          python analysis/backtest.py \
            --klines analysis/data/cache/klines_5m.jsonl \
            --start 2026-10-01T00:00:00+00:00 \
            --out analysis/data/backtest.json

      - name: Validation (canal OOS + deriva + puerta)
        run: |
          python analysis/validation.py \
            --eval analysis/data/eval.json \
            --backtest analysis/data/backtest.json \
            --decisions analysis/data/decisions.jsonl \
            --klines analysis/data/cache/klines_5m.jsonl \
            --collector-health collector/data/health.json \
            --out analysis/data/validation.json \
            --history analysis/data/validation_history.jsonl

      # validation.json lo commitea el pipeline (cada 15 min); aqui solo se
      # guardan los artefactos OOS que escribe este workflow, para no pisarlo.

      - name: Guardar evidencia OOS (solo backtest + eval)
        run: |
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          git config pull.rebase true
          git add analysis/data/backtest.json analysis/data/oos_eval.json || echo "nada que guardar"
          git commit -m "oos: refresco $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          # Los pasos de validation de este mismo job tocan archivos versionados
          # (validation.json, validation_history.jsonl) que commitea el pipeline:
          # se descartan aqui para que el rebase no encuentre cambios sin commitear.
          git reset --hard HEAD -q
          # Varios workflows escriben en main (pipeline, self-heal, este).
          # Rebase sobre el origin mas nuevo + --force-with-lease (nunca pisa
          # trabajo ajeno: solo falla si alguien empujo desde nuestra propia base).
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            if git rebase origin/main && git push --force-with-lease origin HEAD:main; then ok=1; break; fi
            echo "reintento $i/5"; sleep 15
          done
          [ $ok -eq 1 ]

      - name: Publicar replay como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: decisions_hist
          path: analysis/data/decisions_hist.jsonl
          retention-days: 14
          if-no-files-found: warn
