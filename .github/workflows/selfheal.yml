name: Analysis self-heal

# La red de seguridad del pipeline. Si GitHub atrasa el schedule o el colector
# falla, el Vigilante (que corre cada 5 min por cron externo) dispara este
# workflow. Solo ejecuta el pipeline si la ultima decision tiene 15 min o mas.
on:
  workflow_run:
    workflows: ["Vigilante BTC Cloud"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  heal:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Check analysis freshness
        id: check
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = "analysis/data/latest_decision.json"
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              ts = data.get("bar_close_time") or data.get("event_time")
              dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              age = max(0.0, (datetime.now(timezone.utc) - dt).total_seconds() / 60.0)
          except Exception as exc:
              print(f"No se pudo leer latest_decision: {exc}")
              age = 999.0
          print(f"analysis_age_min={age:.1f}")
          stale = "1" if age >= 15.0 else "0"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"stale={stale}\n")
          PY

      - name: Run collector
        if: steps.check.outputs.stale == '1'
        run: python collector/collector.py

      - name: Run decision
        if: steps.check.outputs.stale == '1'
        run: |
          python analysis/run_decision.py \
            --klines collector/data/btcusdt/klines_5m.jsonl \
            --out analysis/data/decisions.jsonl

      - name: Evaluate decisions
        if: steps.check.outputs.stale == '1'
        run: |
          python analysis/evaluate_decisions.py \
            --decisions analysis/data/decisions.jsonl \
            --klines collector/data/btcusdt/klines_5m.jsonl \
            --out analysis/data/eval.json

      - name: Validate model
        if: steps.check.outputs.stale == '1'
        run: |
          python analysis/validation.py \
            --eval analysis/data/eval.json \
            --backtest analysis/data/backtest.json \
            --decisions analysis/data/decisions.jsonl \
            --klines collector/data/btcusdt/klines_5m.jsonl \
            --collector-health collector/data/health.json \
            --out analysis/data/validation.json \
            --history analysis/data/validation_history.jsonl

      - name: Commit self-heal data
        if: steps.check.outputs.stale == '1'
        run: |
          git config user.name "trading-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add collector/data analysis/data
          if git diff --cached --quiet; then
            echo "Sin datos nuevos"
            exit 0
          fi
          git commit -m "data: self-heal $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ok=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && { ok=1; break; } || sleep 5
          done
          [ "$ok" -eq 1 ]
